# Cloudflare Workers 설정
name = "mock-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# ---- 팀 스키마 저장 ----
[[kv_namespaces]]
binding = "SCHEMAS"
id = "92e74219875b4b669e26695d00f1105e"

# gui.html 을 문자열로 임포트
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# 저장 레이트리밋(버스트 계층) — workers.dev 에서도 동작하는 Workers Rate Limiting 바인딩.
# 바인딩은 창을 10/60초만 지원 → 60초 10회 버스트 방어. 시간당 10회 상한은 워커 코드에서.
# namespace_id 는 계정 내에서 고유하면 됨.
[[unsafe.bindings]]
name = "SAVE_RL"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
