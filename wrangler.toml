# Cloudflare Workers 설정
name = "mocappi"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# GUI 소스(src/gui/*)를 한 덩어리 HTML 로 합친다 — dev·deploy 앞에 자동 실행.
# watch_dir 은 반드시 src/gui — "src" 로 두면 산출물(src/gui.generated.html) 쓰기가
# 다시 빌드를 트리거해 무한 루프가 된다.
[build]
command = "node build/gui.mjs"
watch_dir = "src/gui"

# ---- 팀 스키마 저장 ----
[[kv_namespaces]]
binding = "SCHEMAS"
id = "92e74219875b4b669e26695d00f1105e"

# gui.html 을 문자열로 임포트
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# 저장 레이트리밋(버스트 계층) — workers.dev 에서도 동작하는 Workers Rate Limiting 바인딩.
# 바인딩은 창을 10/60초만 지원 → 60초 10회 버스트 방어. 시간당 10회 상한은 워커 코드에서.
# namespace_id 는 계정 내에서 고유하면 됨.
[[unsafe.bindings]]
name = "SAVE_RL"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# D1 저장소 (권장) — KV 대비 쓰기 한도 100배 (무료 100,000/일, 읽기 5,000,000/일).
# 활성화: npx wrangler d1 create mock-api 실행 → 출력된 database_id 를 붙여넣고 주석 해제.
# DB 가 바인딩되면 KV(SCHEMAS) 보다 우선 사용됩니다. 테이블은 자동 생성.
[[d1_databases]]
binding = "DB"
database_name = "mock-api"
database_id = "f90b8b3c-1d3b-4586-b782-588dc278870e"
