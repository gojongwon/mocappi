<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock API Builder</title>
<style>
  :root {
    --bg: #f2f4f6; --panel: #ffffff; --border: #e5e8eb; --border-strong: #d1d6db;
    --text: #191f28; --muted: #6b7684; --faint: #8b95a1;
    --accent: #3182f6; --accent-hover: #1b64da; --accent-soft: #e8f3ff;
    --danger: #f04452; --warn-bg: #fff8e5; --warn-border: #ffe28a; --warn-text: #8a6d1a;
    --radius: 14px; --radius-s: 9px;
    --shadow: 0 1px 2px rgba(2, 32, 71, .04), 0 4px 16px rgba(2, 32, 71, .05);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 14px 28px; background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  .logo { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); flex: none; }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  header .sub { color: var(--faint); font-size: 12.5px; margin-left: 2px; }
  .presets { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .presets .plabel { color: var(--faint); font-size: 12px; margin-right: 2px; }
  .presets button {
    border: 1px solid var(--border); background: var(--panel); border-radius: 999px;
    padding: 5px 14px; cursor: pointer; font-size: 12.5px; color: var(--muted);
    transition: all .12s ease;
  }
  .presets button:hover { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  main {
    display: grid; grid-template-columns: minmax(380px, 5fr) minmax(380px, 6fr);
    gap: 18px; padding: 20px 28px 40px; max-width: 1320px; margin: 0 auto;
  }
  @media (max-width: 880px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow);
  }
  .panel h2 {
    margin: 0 0 12px; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em; color: var(--faint);
  }
  label { font-size: 12.5px; color: var(--muted); }
  input, select, textarea {
    font: inherit; color: inherit; background: var(--panel);
    border: 1px solid var(--border); border-radius: var(--radius-s); padding: 7px 10px;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(49, 130, 246, .15);
  }
  .resource-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .resource-row .prefix { font-family: var(--mono); color: var(--faint); font-size: 13px; }
  .resource-row input { width: 150px; font-family: var(--mono); }
  #fields { display: flex; flex-direction: column; gap: 7px; }
  .frow { display: grid; grid-template-columns: 1fr 1.5fr auto; gap: 7px; align-items: center; }
  .frow input.fname { font-family: var(--mono); font-size: 13px; }
  .frow .fval-wrap { display: flex; gap: 5px; }
  .frow input.fval { font-family: var(--mono); font-size: 13px; flex: 1; min-width: 0; }
  .frow .btns { display: flex; gap: 3px; }
  .frow .btns button {
    border: none; background: none; border-radius: 7px;
    width: 26px; height: 30px; cursor: pointer; color: var(--faint); padding: 0; font-size: 13px;
    transition: all .12s ease;
  }
  .frow .btns button:hover { color: var(--text); background: var(--bg); }
  .frow .btns button.del:hover { color: var(--danger); background: #fef1f2; }
  select.ftype { max-width: 128px; color: var(--faint); font-size: 12px; }
  .field-actions { display: flex; gap: 8px; margin-top: 10px; }
  .field-actions button {
    flex: 1; border: 1px dashed var(--border-strong); background: none; border-radius: var(--radius-s);
    padding: 8px; cursor: pointer; color: var(--muted); font-size: 13px; transition: all .12s ease;
  }
  .field-actions button:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  #inferNote {
    display: none; margin-top: 10px; padding: 9px 12px; border-radius: var(--radius-s);
    background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text);
    font-size: 12px; line-height: 1.6; white-space: pre-line;
  }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; margin-top: 4px; }
  .opts > div { display: flex; flex-direction: column; gap: 4px; }
  .opts input, .opts select { width: 100%; }
  .urlbox {
    font-family: var(--mono); font-size: 12.5px; word-break: break-all; line-height: 1.7;
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-s);
    padding: 12px 14px; min-height: 3.2em;
  }
  .urlbox a { color: var(--accent); text-decoration: none; }
  .url-actions { display: flex; gap: 8px; margin: 12px 0 6px; flex-wrap: wrap; }
  .url-actions button {
    border: none; border-radius: var(--radius-s); padding: 8px 18px; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: all .12s ease;
  }
  #copyBtn { background: var(--accent); color: #fff; }
  #copyBtn:hover { background: var(--accent-hover); }
  #openBtn { background: var(--accent-soft); color: var(--accent); }
  #openBtn:hover { background: #d8eafe; }
  #shareBtn { background: var(--bg); color: var(--muted); font-weight: 500; }
  #shareBtn:hover { background: var(--border); }
  pre#preview {
    font-family: var(--mono); font-size: 12.5px; background: #131722; color: #dbe4f0;
    border-radius: var(--radius-s); padding: 16px; overflow: auto; max-height: 540px; min-height: 220px;
    margin: 0; white-space: pre-wrap; word-break: break-all;
  }
  .status-line { font-size: 12.5px; color: var(--faint); margin: 10px 0 8px; font-family: var(--mono); }
  .status-line .ok { color: #23a55a; font-weight: 700; }
  .status-line .err { color: var(--danger); font-weight: 700; }
  .hintbar { font-size: 12px; color: var(--faint); margin-top: 14px; line-height: 1.8; }
  .hintbar code {
    background: var(--bg); border-radius: 5px; padding: 1px 6px; font-size: 11.5px; font-family: var(--mono);
  }
  .hintbar a { color: var(--accent); }
  /* ---- 붙여넣기 모달 ---- */
  #pasteModal {
    display: none; position: fixed; inset: 0; background: rgba(25, 31, 40, .45);
    z-index: 20; align-items: center; justify-content: center; padding: 20px;
  }
  #pasteModal .card {
    background: var(--panel); border-radius: var(--radius); box-shadow: 0 12px 40px rgba(2, 32, 71, .18);
    width: 600px; max-width: 100%; padding: 22px;
  }
  #pasteModal h3 { margin: 0 0 4px; font-size: 16px; }
  #pasteModal p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  #pasteInput {
    width: 100%; height: 240px; font-family: var(--mono); font-size: 12.5px;
    resize: vertical; line-height: 1.6;
  }
  #pasteError { color: var(--danger); font-size: 12.5px; min-height: 1.2em; margin: 6px 0 4px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .modal-actions button {
    border: none; border-radius: var(--radius-s); padding: 8px 18px; cursor: pointer;
    font-size: 13px; font-weight: 600;
  }
  #pasteApply { background: var(--accent); color: #fff; }
  #pasteApply:hover { background: var(--accent-hover); }
  #pasteCancel { background: var(--bg); color: var(--muted); }
</style>
</head>
<body>
<header>
  <span class="logo"></span>
  <h1>Mock API Builder</h1>
  <span class="sub">URL 만으로 쓰는 커스텀 목 데이터 · 같은 URL = 항상 같은 데이터</span>
  <div class="presets">
    <span class="plabel">프리셋</span>
    <button data-preset="users">사용자</button>
    <button data-preset="products">상품</button>
    <button data-preset="orders">주문</button>
  </div>
</header>

<main>
  <section class="panel">
    <h2>스키마</h2>
    <div class="resource-row">
      <label for="resource">리소스명</label>
      <span class="prefix">/api/</span>
      <input id="resource" value="users" spellcheck="false">
    </div>

    <div id="fields"></div>
    <div class="field-actions">
      <button id="addField">+ 필드 추가</button>
      <button id="pasteBtn">{ } JSON 붙여넣기</button>
    </div>
    <div id="inferNote"></div>

    <h2 style="margin-top:20px">옵션</h2>
    <div class="opts">
      <div><label>전체 개수 (_total)</label><input id="oTotal" type="number" min="0" value="100"></div>
      <div><label>페이지당 (_limit)</label><input id="oLimit" type="number" min="1" max="100" value="10"></div>
      <div><label>페이지 (_page)</label><input id="oPage" type="number" min="1" value="1"></div>
      <div><label>로케일 (_locale)</label>
        <select id="oLocale"><option value="ko">한국어</option><option value="en">English</option></select>
      </div>
      <div><label>지연 ms (_delay)</label><input id="oDelay" type="number" min="0" max="5000" value="0"></div>
      <div><label>상태코드 (_status)</label><input id="oStatus" type="number" min="100" max="599" value="200"></div>
    </div>

    <div class="hintbar">
      중첩: <code>address.city</code> · 배열: <code>tags[]</code> + 값 끝 <code>:개수</code> ·
      범위: <code>int:20~60</code> · 열거: <code>enum:a|b|c</code> ·
      전체 문법: <a href="/schema/types" target="_blank">/schema/types</a>
    </div>
  </section>

  <section class="panel">
    <h2>생성된 URL</h2>
    <div class="urlbox" id="urlBox"></div>
    <div class="url-actions">
      <button id="copyBtn">URL 복사</button>
      <button id="openBtn">새 탭에서 열기</button>
      <button id="shareBtn" title="이 편집 화면 자체를 공유하는 링크">편집 화면 링크 복사</button>
    </div>
    <div class="status-line" id="statusLine">&nbsp;</div>
    <pre id="preview">불러오는 중…</pre>
  </section>
</main>

<div id="pasteModal">
  <div class="card">
    <h3>JSON 붙여넣기</h3>
    <p>실제 API 응답이나 예시 객체를 붙여넣으면 필드와 타입을 자동으로 추론합니다.
       <code style="font-family:var(--mono);font-size:12px">{"data": [...]}</code> 같은 envelope 도 알아서 벗겨냅니다.</p>
    <textarea id="pasteInput" spellcheck="false" placeholder='{"id": "a1b2...", "name": "김민준", "age": 34, "tags": ["a", "b"]}'></textarea>
    <div id="pasteError"></div>
    <div class="modal-actions">
      <button id="pasteCancel">취소</button>
      <button id="pasteApply">추론해서 채우기</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const fieldsEl = $('#fields');
  const OPT_DEFAULTS = { _total: '100', _limit: '10', _page: '1', _locale: 'ko', _delay: '0', _status: '200' };
  const OPT_INPUTS = { _total: '#oTotal', _limit: '#oLimit', _page: '#oPage', _locale: '#oLocale', _delay: '#oDelay', _status: '#oStatus' };

  const PRESETS = {
    users: {
      res: 'users',
      fields: [
        ['id', 'uuid'], ['name', 'person.fullName'], ['email', 'internet.email'],
        ['age', 'int:20~60'], ['address.city', 'location.city'],
        ['avatar', 'image:200x200'], ['createdAt', 'date:2023-01-01~2026-07-01'],
      ],
      opts: { _total: '500', _limit: '20' },
    },
    products: {
      res: 'products',
      fields: [
        ['id', 'uuid'], ['name', 'commerce.productName'], ['price', 'int:1000~99000'],
        ['category', 'commerce.department'], ['inStock', 'bool:0.8'],
        ['tags[]', 'lorem.word:3'], ['image', 'image:300x300'],
      ],
      opts: { _total: '200', _limit: '20' },
    },
    orders: {
      res: 'orders',
      fields: [
        ['id', 'uuid'], ['orderNo', 'index'], ['status', 'enum:pending|paid|shipped|delivered'],
        ['amount', 'int:10000~500000'], ['customer.name', 'person.fullName'],
        ['customer.phone', 'phone.number'], ['orderedAt', 'date:2025-01-01~2026-07-28'],
      ],
      opts: { _total: '300', _limit: '20' },
    },
  };

  // ---- 인코딩: 읽기 좋은 URL 을 위해 안전 문자는 되살린다 ----
  const enc = (s) => encodeURIComponent(s)
    .replace(/%3A/gi, ':').replace(/%7E/gi, '~').replace(/%7C/gi, '|')
    .replace(/%5B/gi, '[').replace(/%5D/gi, ']').replace(/%2C/gi, ',');

  // ---- 필드 행 ----
  function addRow(name = '', value = '') {
    const row = document.createElement('div');
    row.className = 'frow';
    row.innerHTML =
      '<input class="fname" placeholder="필드명" spellcheck="false">' +
      '<div class="fval-wrap">' +
        '<input class="fval" placeholder="타입 (예: int:20~60)" spellcheck="false">' +
        '<select class="ftype"><option value="">타입 선택…</option></select>' +
      '</div>' +
      '<div class="btns">' +
        '<button class="up" title="위로">↑</button>' +
        '<button class="down" title="아래로">↓</button>' +
        '<button class="del" title="삭제">✕</button>' +
      '</div>';
    row.querySelector('.fname').value = name;
    row.querySelector('.fval').value = value;
    fillTypeSelect(row.querySelector('.ftype'));
    fieldsEl.appendChild(row);
    return row;
  }

  let typeOptions = null; // /schema/types 응답 — 단일 소스
  function fillTypeSelect(sel) {
    if (!typeOptions) return;
    const gFaker = document.createElement('optgroup'); gFaker.label = '자주 쓰는 값 (faker)';
    for (const p of typeOptions.fakerPaths) {
      const o = document.createElement('option'); o.value = p.value; o.textContent = p.label + ' — ' + p.value;
      gFaker.appendChild(o);
    }
    const gDsl = document.createElement('optgroup'); gDsl.label = 'DSL 타입';
    for (const t of typeOptions.dslTypes) {
      const o = document.createElement('option'); o.value = t.example; o.textContent = t.label + ' — ' + t.syntax;
      gDsl.appendChild(o);
    }
    sel.appendChild(gFaker); sel.appendChild(gDsl);
  }

  function readState() {
    const fields = [];
    for (const row of fieldsEl.querySelectorAll('.frow')) {
      const n = row.querySelector('.fname').value.trim();
      const v = row.querySelector('.fval').value.trim();
      if (n && v) fields.push([n, v]);
    }
    const opts = {};
    for (const [k, sel] of Object.entries(OPT_INPUTS)) {
      const v = String($(sel).value).trim();
      if (v !== '' && v !== OPT_DEFAULTS[k]) opts[k] = v;
    }
    return { res: $('#resource').value.trim() || 'items', fields, opts };
  }

  function buildQuery(state) {
    const parts = [];
    for (const [n, v] of state.fields) parts.push(enc(n) + '=' + enc(v));
    for (const [k, v] of Object.entries(state.opts)) parts.push(k + '=' + enc(v));
    return parts.join('&');
  }

  function apiUrl(state) {
    return location.origin + '/api/' + encodeURIComponent(state.res) + '?' + buildQuery(state);
  }

  // ---- GUI 상태 ↔ 주소창 (현재 URL 이 곧 GUI 상태) ----
  function syncAddressBar(state) {
    const q = '_res=' + enc(state.res) + (state.fields.length || Object.keys(state.opts).length ? '&' + buildQuery(state) : '');
    history.replaceState(null, '', '/?' + q);
  }

  function loadFromAddressBar() {
    const params = new URLSearchParams(location.search);
    if (![...params.keys()].length || !params.has('_res')) return false;
    $('#resource').value = params.get('_res') || 'items';
    fieldsEl.innerHTML = '';
    for (const [k, v] of params) {
      if (k === '_res') continue;
      if (k in OPT_INPUTS) { $(OPT_INPUTS[k]).value = v; continue; }
      if (k.startsWith('_')) continue;
      addRow(k, v);
    }
    if (!fieldsEl.children.length) addRow();
    return true;
  }

  function applyPreset(name) {
    const p = PRESETS[name];
    $('#resource').value = p.res;
    fieldsEl.innerHTML = '';
    for (const [n, v] of p.fields) addRow(n, v);
    for (const [k, sel] of Object.entries(OPT_INPUTS)) $(sel).value = (p.opts && p.opts[k]) || OPT_DEFAULTS[k];
    update();
  }

  // ---- 미리보기 (디바운스 300ms) ----
  let timer = null; let reqSeq = 0;
  function update() {
    const state = readState();
    const url = apiUrl(state);
    $('#urlBox').innerHTML = '';
    const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.textContent = url;
    $('#urlBox').appendChild(a);
    syncAddressBar(state);
    clearTimeout(timer);
    timer = setTimeout(() => preview(url), 300);
  }

  async function preview(url) {
    const seq = ++reqSeq;
    const t0 = performance.now();
    $('#statusLine').textContent = '요청 중… GET ' + url.slice(location.origin.length);
    try {
      const res = await fetch(url);
      const text = await res.text();
      if (seq !== reqSeq) return; // 오래된 응답 무시
      const ms = Math.round(performance.now() - t0);
      const cls = res.ok ? 'ok' : 'err';
      $('#statusLine').innerHTML = 'HTTP <span class="' + cls + '">' + res.status + '</span> · ' + ms + 'ms';
      let body = text;
      try { body = JSON.stringify(JSON.parse(text), null, 2); } catch {}
      $('#preview').textContent = body;
    } catch (e) {
      if (seq !== reqSeq) return;
      $('#statusLine').innerHTML = '<span class="err">요청 실패</span>';
      $('#preview').textContent = String(e);
    }
  }

  // ---- JSON 붙여넣기 → 추론 ----
  function openPaste() {
    $('#pasteError').textContent = '';
    $('#pasteModal').style.display = 'flex';
    $('#pasteInput').focus();
  }
  function closePaste() { $('#pasteModal').style.display = 'none'; }

  async function applyPaste() {
    const raw = $('#pasteInput').value.trim();
    if (!raw) { $('#pasteError').textContent = 'JSON 을 입력하세요.'; return; }
    try { JSON.parse(raw); }
    catch (e) { $('#pasteError').textContent = 'JSON 파싱 실패: ' + e.message; return; }
    let result;
    try {
      const res = await fetch('/schema/infer', { method: 'POST', body: raw, headers: { 'content-type': 'application/json' } });
      result = await res.json();
      if (!res.ok) { $('#pasteError').textContent = (result.error || '추론 실패') + (result.hint ? ' — ' + result.hint : ''); return; }
    } catch (e) { $('#pasteError').textContent = '요청 실패: ' + e; return; }
    fieldsEl.innerHTML = '';
    for (const f of result.fields) addRow(f.name, f.type);
    const note = $('#inferNote');
    if (result.skipped && result.skipped.length) {
      note.textContent = '추론에서 제외됨:\n' + result.skipped.map((s) => '· ' + s.path + ' — ' + s.reason).join('\n');
      note.style.display = 'block';
      clearTimeout(note._t); note._t = setTimeout(() => (note.style.display = 'none'), 12000);
    } else {
      note.style.display = 'none';
    }
    closePaste();
    update();
  }

  // ---- 클립보드 ----
  async function copyText(t, btn, done) {
    try { await navigator.clipboard.writeText(t); }
    catch {
      const ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    const orig = btn.textContent;
    btn.textContent = done; setTimeout(() => (btn.textContent = orig), 1200);
  }

  // ---- 이벤트 ----
  document.addEventListener('input', (e) => {
    if (e.target.matches('.fname, .fval, #resource, .opts input, .opts select')) update();
  });
  document.addEventListener('change', (e) => {
    if (e.target.matches('select.ftype')) {
      if (e.target.value) {
        e.target.closest('.fval-wrap').querySelector('.fval').value = e.target.value;
        e.target.selectedIndex = 0;
        update();
      }
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePaste();
  });
  document.addEventListener('click', (e) => {
    const row = e.target.closest('.frow');
    if (e.target.matches('.del')) { row.remove(); update(); }
    else if (e.target.matches('.up') && row.previousElementSibling) { row.parentNode.insertBefore(row, row.previousElementSibling); update(); }
    else if (e.target.matches('.down') && row.nextElementSibling) { row.parentNode.insertBefore(row.nextElementSibling, row); update(); }
    else if (e.target.id === 'addField') { addRow(); }
    else if (e.target.id === 'pasteBtn') { openPaste(); }
    else if (e.target.id === 'pasteCancel') { closePaste(); }
    else if (e.target.id === 'pasteApply') { applyPaste(); }
    else if (e.target.id === 'pasteModal') { closePaste(); }
    else if (e.target.id === 'copyBtn') { copyText(apiUrl(readState()), e.target, '복사됨 ✓'); }
    else if (e.target.id === 'openBtn') { window.open(apiUrl(readState()), '_blank'); }
    else if (e.target.id === 'shareBtn') { copyText(location.href, e.target, '복사됨 ✓'); }
    else if (e.target.dataset.preset) { applyPreset(e.target.dataset.preset); }
  });

  // ---- 초기화 ----
  (async () => {
    try {
      typeOptions = await (await fetch('/schema/types')).json();
    } catch { typeOptions = { fakerPaths: [], dslTypes: [] }; }
    if (!loadFromAddressBar()) {
      // 첫 방문: 사용자 프리셋으로 온보딩
      const p = PRESETS.users;
      $('#resource').value = p.res;
      for (const [n, v] of p.fields) addRow(n, v);
      for (const [k, sel] of Object.entries(OPT_INPUTS)) $(sel).value = (p.opts && p.opts[k]) || OPT_DEFAULTS[k];
    } else {
      for (const sel of document.querySelectorAll('select.ftype')) if (sel.options.length <= 1) fillTypeSelect(sel);
    }
    update();
  })();
})();
</script>
</body>
</html>
